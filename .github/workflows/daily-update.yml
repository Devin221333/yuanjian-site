# 每个交易日北京时间 16:40 自动更新行情数字和文字解读，然后提交回仓库。
# 如果网站托管在 Cloudflare Pages / Netlify / Vercel 等“连接 GitHub 自动部署”的平台，
# 提交之后网站会自动重新发布，无需其他操作。
name: 每日数据更新

on:
  schedule:
    - cron: "40 8 * * 1-5"   # UTC 08:40 = 北京时间 16:40，周一到周五
    - cron: "10 10 * * 1-5"  # 备用：UTC 10:10 = 北京时间 18:10。GitHub 定时任务偶尔漏跑；数据没变时不会提交，多跑一次没有副作用
  workflow_dispatch: {}      # 允许在 GitHub 网页上手动点“Run workflow”

permissions:
  contents: write

# 两次定时或手动运行撞在一起时排队执行，避免同时提交冲突
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 更新行情数字
        run: python scripts/update_market.py
      # 可选：没有在 Secrets 里添加 ANTHROPIC_API_KEY 时这一步会自动跳过（不产生费用），
      # 网站继续使用上一步按数字自动生成的模板文字。
      - name: 更新文字解读（可选，需要 ANTHROPIC_API_KEY）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_commentary.py
      - name: 提交更新
        run: |
          if git diff --quiet; then
            echo "数据没有变化（可能是休市日），不提交。"
            exit 0
          fi
          git config user.name "yuanjian-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
      # 如果托管平台不会自动从 GitHub 部署（例如国内云服务器 / 对象存储），
      # 在这里加一步上传，例如用 ossutil、coscmd 或 rsync 把整个网站目录同步过去。
